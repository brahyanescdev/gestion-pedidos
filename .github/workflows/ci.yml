name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Pedidos.sln

      - name: Build
        run: dotnet build Pedidos.sln --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test Pedidos.sln
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage summary
        run: >
          reportgenerator
          "-reports:./coverage/**/coverage.cobertura.xml"
          "-targetdir:./coverage/report"
          "-reporttypes:TextSummary"
          "-classfilters:+Pedidos.Domain.*;+Pedidos.Application.*"

      - name: Show coverage summary
        run: cat ./coverage/report/Summary.txt

      - name: Enforce 80% coverage gate on Domain and Application
        run: |
          LINE_COVERAGE=$(grep "Line coverage:" ./coverage/report/Summary.txt | grep -o "[0-9]*\.[0-9]*" | head -1)
          echo "Cobertura de línea en Domain+Application: $LINE_COVERAGE%"
          awk -v cov="$LINE_COVERAGE" 'BEGIN { exit !(cov >= 80) }'
